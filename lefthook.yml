pre-commit:
  parallel: true
  commands:
    biome:
      run: bunx biome check --write {staged_files} && git add {staged_files}
      glob: "*.{ts,js,json,toml}"
    gitleaks:
      run: gitleaks protect --staged --redact --config .gitleaks.toml

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: bun tsc --noEmit
    test:
      run: bun test --isolate
