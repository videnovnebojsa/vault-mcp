name: Release Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v0.1.2)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build + Smoke (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      # Keep fail-fast disabled so every platform reports, but do not use
      # continue-on-error: a missing platform asset must fail the release.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vault-mcp-linux-x64
          - os: macos-latest
            artifact: vault-mcp-macos-arm64
          - os: macos-15-intel
            artifact: vault-mcp-macos-x64
          - os: windows-latest
            artifact: vault-mcp-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.3.14" }

      - run: bun install --frozen-lockfile

      - name: Build binary
        shell: bash
        run: BUN_BINARY_NAME=${{ matrix.artifact }} bun run bunbuild.ts

      - name: Smoke test
        shell: bash
        run: bun run scripts/smoke-test.ts ./dist-bin/${{ matrix.artifact }}

      - name: Stash binary as Actions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist-bin/${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist-bin
          merge-multiple: true

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --prerelease \
            --title "$TAG" \
            --notes "See [CHANGELOG](https://github.com/${REPO}/blob/main/CHANGELOG.md) for details." \
            dist-bin/vault-mcp-linux-x64 \
            dist-bin/vault-mcp-macos-arm64 \
            dist-bin/vault-mcp-macos-x64 \
            "dist-bin/vault-mcp-windows-x64.exe"
