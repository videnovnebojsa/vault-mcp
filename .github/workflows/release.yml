name: Release Binaries

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v0.2.0-rc1)"
        required: false

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build + Smoke (${{ matrix.os }})
    permissions:
      contents: write  # needed to upload release assets
    strategy:
      # Keep fail-fast disabled so every platform reports, but do not use
      # continue-on-error: a missing platform asset must fail the release.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vault-mcp-linux-x64
          - os: macos-latest
            artifact: vault-mcp-macos-arm64
          - os: macos-15-intel
            artifact: vault-mcp-macos-x64
          - os: windows-latest
            artifact: vault-mcp-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.3.14" }

      - run: bun install --frozen-lockfile

      - name: Build binary
        shell: bash
        run: BUN_BINARY_NAME=${{ matrix.artifact }} bun run bunbuild.ts

      - name: Smoke test
        shell: bash
        run: bun run scripts/smoke-test.ts ./dist-bin/${{ matrix.artifact }}

      - name: Upload release asset
        if: (github.event_name == 'release' || github.event.inputs.tag != '') && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          gh release upload "$TAG" "./dist-bin/${{ matrix.artifact }}" --clobber
