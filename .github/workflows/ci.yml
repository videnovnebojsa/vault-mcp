name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run lint

  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: rhysd/actionlint@a443f344ff32813837fa49f7aa6cbc478d770e62  # v1.7.9

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: "."
          severity: warning

  psscriptanalyzer:
    name: Lint PowerShell
    runs-on: ubuntu-latest  # pwsh is preinstalled on GitHub runners
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # Excluded rules are idiomatic for an interactive installer, not defects:
          #   PSAvoidUsingWriteHost                       — installers print to the host on purpose
          #   PSUseApprovedVerbs                          — Prompt-Input is a deliberate local helper name
          #   PSUseShouldProcessForStateChangingFunctions — this is a script, not a cmdlet module
          #   PSUseSingularNouns                          — Invoke-Schtasks mirrors the schtasks command name
          #   PSUseBOMForUnicodeEncodedFile               — a BOM would be injected into the `irm | iex` string
          $excluded = @(
            'PSAvoidUsingWriteHost',
            'PSUseApprovedVerbs',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSUseSingularNouns',
            'PSUseBOMForUnicodeEncodedFile'
          )
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error -ExcludeRule $excluded
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($results.Count) issue(s) in install.ps1"
          }
          Write-Host 'OK: PSScriptAnalyzer clean'

  dead-code:
    name: Dead Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run check:dead

  type-coverage:
    name: Type Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run check:types-coverage

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: Secret Scan (verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3
        with:
          extra_args: --only-verified

  test:
    name: Test + Coverage
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun test --isolate --coverage

  audit:
    name: Dependency Audit
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=moderate

  build:
    name: Build
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: BUN_BINARY_NAME=vault-mcp-linux-x64 bun run build:bun
      - name: Upload Linux binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vault-mcp-linux-x64
          path: dist-bin/vault-mcp-linux-x64
          if-no-files-found: error

  integration:
    name: Integration (Linux binary)
    needs: [build]
    runs-on: ubuntu-latest
    # Run on push and PR. GitHub exposes pull_request.changed_files as a count,
    # not a path list, so path-sensitive PR filtering would skip real changes.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vault-mcp-linux-x64
          path: dist-bin
      - run: chmod +x dist-bin/vault-mcp-linux-x64

      # Create a minimal vault so install.sh has a valid path to accept
      - name: Create install-time vault
        run: mkdir -p /tmp/vault-install

      # Exercise install.sh with a local binary (no GitHub download).
      # Config answers piped via stdin: vault path, port, API key (empty), embeddings (N).
      - name: Run install.sh (--local-bin, --no-service)
        run: |
          printf '/tmp/vault-install\n3782\n\nN\n' | \
            bash install.sh \
              --local-bin=./dist-bin/vault-mcp-linux-x64 \
              --no-service

      # Assert the .env was written with the variable names the server actually reads.
      # This is a regression guard — it would have caught the VAULT_DEFAULT_PATH bug.
      - name: Assert .env correctness
        run: |
          grep -q 'OBSIDIAN_VAULT_PATH=' ~/.config/vault-mcp/.env \
            || { echo "FAIL: OBSIDIAN_VAULT_PATH missing from .env"; exit 1; }
          grep -q 'MCP_PORT=3782' ~/.config/vault-mcp/.env \
            || { echo "FAIL: MCP_PORT missing from .env"; exit 1; }
          ! grep -q 'VAULT_DEFAULT_PATH' ~/.config/vault-mcp/.env \
            || { echo "FAIL: stale VAULT_DEFAULT_PATH found in .env"; exit 1; }
          echo "OK: .env keys correct"

      # Full end-to-end MCP tool test against the installed binary.
      # The integration test creates its own isolated vault and config dir,
      # starts the binary, and exercises 17 tool calls with real assertions.
      - name: Run integration test
        run: INTEGRATION_TEST_PORT=34782 bun run scripts/integration-test.ts ~/.local/bin/vault-mcp

  integration-windows:
    name: Integration (Windows install.ps1)
    needs: [test, audit]
    runs-on: windows-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile

      # Build a native Windows binary to stage via -LocalBin (no GitHub download).
      - name: Build Windows binary
        run: bun run build:bun
        env:
          BUN_BINARY_NAME: vault-mcp-windows-x64.exe

      - name: Create install-time vault
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path C:\vault-install | Out-Null

      # Installer prompt answers, one per line: vault path, port, API key (empty),
      # embeddings (N), background service (Y). Answering Y to the service prompt
      # exercises the schtasks /Query-when-absent path that previously aborted the
      # installer under $ErrorActionPreference='Stop' — this is the regression guard.
      - name: Stage installer answers
        shell: pwsh
        run: Set-Content ci-answers.txt -Value @('C:\vault-install', '3782', '', 'N', 'Y')

      # Invoke via cmd so install.ps1 keeps its own $ErrorActionPreference='Stop'
      # (a GitHub `shell: pwsh` step would override it) — faithfully reproducing
      # the end-user environment where the bug surfaced.
      - name: Run install.ps1 (-LocalBin, service registration)
        shell: cmd
        run: type ci-answers.txt | pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1 -LocalBin dist-bin\vault-mcp-windows-x64.exe

      - name: Assert install result
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'vault-mcp\vault-mcp.exe'
          if (-not (Test-Path $bin)) { throw "FAIL: binary not staged at $bin" }
          $envFile = Join-Path $env:APPDATA 'vault-mcp\.env'
          if (-not (Test-Path $envFile)) { throw "FAIL: .env not written to $envFile" }
          $content = Get-Content $envFile -Raw
          if ($content -notmatch 'OBSIDIAN_VAULT_PATH=') { throw 'FAIL: OBSIDIAN_VAULT_PATH missing from .env' }
          if ($content -notmatch 'MCP_PORT=3782')        { throw 'FAIL: MCP_PORT missing from .env' }
          if ($content -match 'VAULT_DEFAULT_PATH')       { throw 'FAIL: stale VAULT_DEFAULT_PATH in .env' }
          # The scheduled task must exist — proves the installer ran past the
          # schtasks /Query-when-absent check and /Create succeeded.
          schtasks /Query /TN vault-mcp 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FAIL: vault-mcp scheduled task was not registered' }
          # The hidden-launch shim must be staged next to the binary (console-window fix).
          $vbs = Join-Path $env:LOCALAPPDATA 'vault-mcp\launch-hidden.vbs'
          if (-not (Test-Path $vbs)) { throw "FAIL: launch-hidden.vbs not staged at $vbs" }
          $vbsBody = Get-Content $vbs -Raw
          if ($vbsBody -notmatch 'WScript\.Shell')      { throw 'FAIL: launch-hidden.vbs missing WScript.Shell launcher' }
          if ($vbsBody -notmatch [regex]::Escape($bin)) { throw 'FAIL: launch-hidden.vbs does not reference the binary path' }
          # ", 0, False" is the window-style-0 (hidden), non-blocking Run signature.
          if ($vbsBody -notmatch ', 0, False')          { throw 'FAIL: launch-hidden.vbs not launching with a hidden window (style 0)' }
          # The task must launch via the hidden wscript shim, never the console exe directly.
          $action = (Get-ScheduledTask -TaskName vault-mcp).Actions[0]
          if ($action.Execute -notmatch 'wscript\.exe')         { throw "FAIL: task launches '$($action.Execute)', not wscript.exe (console window would appear)" }
          if ($action.Arguments -notmatch 'launch-hidden\.vbs') { throw "FAIL: task does not pass launch-hidden.vbs to wscript (args: '$($action.Arguments)')" }
          Write-Host 'OK: binary staged, .env correct, task registered via hidden wscript shim'

      # Re-run in -Configure mode against the now-existing install. This exercises the
      # branch where an already-registered task is re-created so it adopts the wscript
      # launcher — the upgrade path for installs created before the console-window fix.
      # The 5 staged answers cover the config prompts (vault, port, key, embeddings); the
      # service prompt is skipped in this branch, so the trailing answer is harmlessly unused.
      - name: Run install.ps1 -Configure (re-register existing task)
        shell: cmd
        run: type ci-answers.txt | pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Configure

      - name: Assert -Configure result
        shell: pwsh
        run: |
          schtasks /Query /TN vault-mcp 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FAIL: scheduled task missing after -Configure' }
          $action = (Get-ScheduledTask -TaskName vault-mcp).Actions[0]
          if ($action.Execute -notmatch 'wscript\.exe') { throw "FAIL: -Configure left the task launching '$($action.Execute)', not the wscript launcher" }
          Write-Host 'OK: -Configure re-registered task with hidden launcher'

      - name: Clean up scheduled task
        if: always()
        shell: pwsh
        run: schtasks /Delete /TN vault-mcp /F 2>&1 | Out-Null; exit 0
