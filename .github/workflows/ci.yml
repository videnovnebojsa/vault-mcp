name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run lint

  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: rhysd/actionlint@a443f344ff32813837fa49f7aa6cbc478d770e62  # v1.7.9

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: "."
          pattern: "*.sh"
          severity: warning

  dead-code:
    name: Dead Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run check:dead

  type-coverage:
    name: Type Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run check:types-coverage

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: Secret Scan (verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3
        with:
          extra_args: --only-verified

  test:
    name: Test + Coverage
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun test --isolate --coverage

  audit:
    name: Dependency Audit
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=moderate

  build:
    name: Build
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: BUN_BINARY_NAME=vault-mcp-linux-x64 bun run build:bun
      - name: Upload Linux binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vault-mcp-linux-x64
          path: dist-bin/vault-mcp-linux-x64
          if-no-files-found: error

  integration:
    name: Integration (Linux binary)
    needs: [build]
    runs-on: ubuntu-latest
    # Run on push and PR. GitHub exposes pull_request.changed_files as a count,
    # not a path list, so path-sensitive PR filtering would skip real changes.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with: { bun-version: "1.x" }
      - run: bun install --frozen-lockfile

      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: vault-mcp-linux-x64
          path: dist-bin
      - run: chmod +x dist-bin/vault-mcp-linux-x64

      # Create a minimal vault so install.sh has a valid path to accept
      - name: Create install-time vault
        run: mkdir -p /tmp/vault-install

      # Exercise install.sh with a local binary (no GitHub download).
      # Config answers piped via stdin: vault path, port, API key (empty), embeddings (N).
      - name: Run install.sh (--local-bin, --no-service)
        run: |
          printf '/tmp/vault-install\n3782\n\nN\n' | \
            bash install.sh \
              --local-bin=./dist-bin/vault-mcp-linux-x64 \
              --no-service

      # Assert the .env was written with the variable names the server actually reads.
      # This is a regression guard — it would have caught the VAULT_DEFAULT_PATH bug.
      - name: Assert .env correctness
        run: |
          grep -q 'OBSIDIAN_VAULT_PATH=' ~/.config/vault-mcp/.env \
            || { echo "FAIL: OBSIDIAN_VAULT_PATH missing from .env"; exit 1; }
          grep -q 'MCP_PORT=3782' ~/.config/vault-mcp/.env \
            || { echo "FAIL: MCP_PORT missing from .env"; exit 1; }
          ! grep -q 'VAULT_DEFAULT_PATH' ~/.config/vault-mcp/.env \
            || { echo "FAIL: stale VAULT_DEFAULT_PATH found in .env"; exit 1; }
          echo "OK: .env keys correct"

      # Full end-to-end MCP tool test against the installed binary.
      # The integration test creates its own isolated vault and config dir,
      # starts the binary, and exercises 17 tool calls with real assertions.
      - name: Run integration test
        run: INTEGRATION_TEST_PORT=34782 bun run scripts/integration-test.ts ~/.local/bin/vault-mcp
